name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_extended:
        description: Run Clang and sanitizer validation in addition to routine gates
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '31 4 * * 3'

concurrency:
  # Extended validation must not be cancelled by a routine main push.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.run_extended }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    name: Source and package metadata
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install validation tools
        run: |
          pacman -Syu --noconfirm --needed \
            appstream clang desktop-file-utils git python

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust checkout and prepare package-test user
        run: |
          git config --global --add safe.directory "$PWD"
          useradd --create-home --home-dir /tmp/omacalendar-package-test package-test

      - name: Check C++ formatting
        shell: bash
        run: |
          mapfile -t sources < <(git ls-files '*.cpp' '*.h')
          clang-format --dry-run --Werror "${sources[@]}"

      - name: Validate shell scripts
        run: |
          for script in packaging/arch/*.in packaging/release/*.sh scripts/*.sh; do
            bash -n "${script}"
          done
          runuser -u package-test -- packaging/release/test-versioning.sh

      - name: Validate native Arch package assembly
        run: runuser -u package-test -- packaging/release/test-arch-package.sh

      - name: Validate package SBOM finalization
        run: python3 packaging/release/test-finalize-sbom.py

      - name: Validate desktop metadata
        run: desktop-file-validate packaging/org.omacalendar.OmaCalendar.desktop

      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net --strict packaging/org.omacalendar.OmaCalendar.metainfo.xml

  build:
    name: ${{ matrix.name }}
    if: github.event_name == 'schedule' || inputs.run_extended == true
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Clang RelWithDebInfo
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo
    steps:
      - name: Install current Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            appstream clang cmake desktop-file-utils git libical libsecret \
            ninja pkgconf qt6-base qt6-declarative qt6-networkauth systemd zstd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DOMACALENDAR_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test daemon restart
        run: packaging/release/smoke-daemon.sh build

      - name: Smoke-test desktop startup
        run: packaging/release/smoke-app.sh build

      - name: Lint QML
        run: packaging/release/check-qmllint.sh build

      - name: Validate staged installation
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          packaging/release/verify-install.sh "$PWD/stage"

      - name: Verify package uninstall manifest
        run: |
          cp -a stage stage-uninstall
          packaging/release/verify-uninstall.sh \
            "$PWD/stage-uninstall" "$PWD/build/install_manifest.txt"

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang cmake git libical libsecret ninja pkgconf qt6-base \
            qt6-declarative qt6-networkauth systemd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure sanitizer build
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-sanitized -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DOMACALENDAR_ENABLE_SANITIZERS=ON \
            -DOMACALENDAR_ENABLE_WERROR=ON

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_NO_GLIB: '1'
          QT_QPA_PLATFORM: offscreen
          # Sanitizers slow the daemon's startup over the 120,000-event
          # performance fixture; startup time is reported, not gated.
          OMACALENDAR_PERF_STARTUP_TIMEOUT: '120'
          FULL_SUITE: ${{ github.event_name == 'schedule' || inputs.run_extended == true }}
        run: |
          # Pull requests and pushes skip the performance-labelled fixtures to
          # keep the job short; scheduled and extended runs keep the full suite.
          if [ "${FULL_SUITE}" = "true" ]; then
            ctest --test-dir build-sanitized --output-on-failure
          else
            ctest --test-dir build-sanitized --output-on-failure -LE performance
          fi

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            clang cmake compiler-rt git libical libsecret ninja pkgconf qt6-base \
            qt6-declarative qt6-networkauth systemd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure fuzzing build
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DOMACALENDAR_BUILD_APP=OFF \
            -DOMACALENDAR_BUILD_FUZZERS=ON

      - name: Build fuzz targets
        run: |
          cmake --build build-fuzz --parallel --target \
            omacalendar-fuzz-icalendar omacalendar-fuzz-caldav_multistatus \
            omacalendar-fuzz-google_event omacalendar-fuzz-ipc_request \
            omacalendar-fuzz-quickadd

      - name: Fuzz each target
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          QT_NO_GLIB: '1'
          # Scheduled and extended runs fuzz longer; pull requests use a fixed
          # seed and run count so the result is reproducible.
          RUNS: ${{ (github.event_name == 'schedule' || inputs.run_extended == true) && '500000' || '20000' }}
        run: |
          mkdir -p fuzz-artifacts
          for target in icalendar caldav_multistatus google_event ipc_request quickadd; do
            work="$(mktemp -d)"
            cp -a "tests/fuzz/corpus/${target}/." "${work}/"
            echo "::group::${target}"
            "build-fuzz/tests/fuzz/omacalendar-fuzz-${target}" "${work}" \
              -runs="${RUNS}" -seed=1 -timeout=10 -rss_limit_mb=2048 -max_len=65536 \
              -artifact_prefix="fuzz-artifacts/${target}-"
            echo "::endgroup::"
          done

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-artifacts
          path: fuzz-artifacts/
          if-no-files-found: ignore

  arch-current:
    name: Current Arch package baseline
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install current Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            appstream cmake desktop-file-utils git libical libsecret ninja \
            pkgconf qt6-base qt6-declarative qt6-networkauth systemd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DOMACALENDAR_ENABLE_WERROR=ON

      - name: Build, test, and lint
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          packaging/release/smoke-daemon.sh build
          packaging/release/smoke-app.sh build
          packaging/release/check-qmllint.sh build

      - name: Validate install and uninstall
        run: |
          DESTDIR="$PWD/stage" cmake --install build
          packaging/release/verify-install.sh "$PWD/stage"
          cp -a stage stage-uninstall
          packaging/release/verify-uninstall.sh \
            "$PWD/stage-uninstall" "$PWD/build/install_manifest.txt"
