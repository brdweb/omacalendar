name: Release candidate

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to build without creating a release
        required: true
        default: 1.0.0-rc.1
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-release-candidate:
    name: Build and attest Arch candidate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    outputs:
      version: ${{ steps.version.outputs.value }}
      suffix: ${{ steps.version.outputs.suffix }}
      arch_pkgver: ${{ steps.version.outputs.arch_pkgver }}
    steps:
      - name: Install current Arch dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            appstream cmake desktop-file-utils git github-cli libical libsecret \
            ninja pkgconf qt6-base qt6-declarative qt6-networkauth systemd zstd

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Trust the container checkout
        run: git config --global --add safe.directory "$PWD"

      - name: Verify tag and release metadata
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_object=$(git rev-parse "${GITHUB_REF_NAME}^{tag}")
          verified=$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" \
            --jq '.verification.verified')
          if [[ ${verified} != true ]]; then
            echo "GitHub did not verify the annotated tag signature" >&2
            exit 1
          fi

      - name: Verify candidate tree and release metadata
        if: github.event_name == 'push'
        env:
          OMACALENDAR_GITHUB_VERIFIED_TAG: '1'
        run: |
          if [[ ${GITHUB_REF_NAME} =~ -rc\.[0-9]+$ ]]; then
            packaging/release/verify-release.sh --draft-candidate "${GITHUB_REF_NAME}"
          else
            packaging/release/verify-release.sh "${GITHUB_REF_NAME}"
          fi

      - name: Verify rehearsal source
        if: github.event_name == 'workflow_dispatch'
        run: |
          git diff --exit-code
          useradd --create-home --home-dir /tmp/omacalendar-release-test \
            omacalendar-release-test
          runuser -u omacalendar-release-test -- \
            packaging/release/test-versioning.sh

      - name: Resolve version
        id: version
        shell: bash
        env:
          REHEARSAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ ${GITHUB_EVENT_NAME} == workflow_dispatch ]]; then
            release_version=${REHEARSAL_VERSION}
          else
            release_version=${GITHUB_REF_NAME#v}
          fi
          source packaging/release/version-lib.sh
          if ! validate_release_version "${release_version}"; then
            echo "release version is not canonical semantic versioning" >&2
            exit 1
          fi
          numeric_version=${release_version%%-*}
          version_suffix=${release_version#"${numeric_version}"}
          is_prerelease=false
          if [[ -n ${version_suffix} ]]; then
            is_prerelease=true
          fi
          arch_pkgver=$(arch_pkgver "${release_version}")
          {
            echo "value=${release_version}"
            echo "suffix=${version_suffix}"
            echo "is_prerelease=${is_prerelease}"
            echo "arch_pkgver=${arch_pkgver}"
          } >>"${GITHUB_OUTPUT}"

      - name: Configure release
        # PLAN.md assigns timing thresholds to release-reference Omarchy hardware.
        # Hosted runners still execute the 100,000-event correctness/crash smoke.
        env:
          CC: gcc
          CXX: g++
          OMACALENDAR_BUILD_GOOGLE_CLIENT_ID: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_ID }}
          OMACALENDAR_BUILD_GOOGLE_CLIENT_SECRET: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_SECRET }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DOMACALENDAR_ENABLE_WERROR=ON \
            -DOMACALENDAR_ENABLE_HARDWARE_PERF_TESTS=OFF \
            -DOMACALENDAR_REQUIRE_GOOGLE_OAUTH_CONFIG=ON \
            -DOMACALENDAR_VERSION_SUFFIX=${{ steps.version.outputs.suffix }}

      - name: Build, test, and lint
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          packaging/release/smoke-daemon.sh build \
            "${{ steps.version.outputs.value }}"
          packaging/release/smoke-app.sh build
          packaging/release/check-qmllint.sh build

      - name: Stage and validate installation
        run: |
          mkdir -p artifacts stage
          DESTDIR="$PWD/stage" cmake --install build
          packaging/release/verify-install.sh "$PWD/stage"
          packaging/release/smoke-daemon.sh "$PWD/stage/usr/bin" \
            "${{ steps.version.outputs.value }}"
          packaging/release/smoke-app.sh "$PWD/stage/usr/bin"
          cp -a stage stage-uninstall
          packaging/release/verify-uninstall.sh \
            "$PWD/stage-uninstall" "$PWD/build/install_manifest.txt"

      - name: Create binary and source archives
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          tar --zstd -cf "artifacts/omacalendar-${RELEASE_VERSION}-linux-x86_64.tar.zst" -C stage .
          git archive --format=tar.gz \
            --prefix="omacalendar-${RELEASE_VERSION}/" \
            --output="artifacts/omacalendar-${RELEASE_VERSION}-source.tar.gz" \
            "${GITHUB_SHA}"
          pacman -Q >"artifacts/omacalendar-${RELEASE_VERSION}-arch-packages.txt"

      - name: Build and validate native Arch package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          package_user=omacalendar-package-builder
          package_home=/tmp/omacalendar-package-builder
          package_output=/tmp/omacalendar-native-package
          useradd --system --create-home --home-dir "${package_home}" "${package_user}"
          install -d -o "${package_user}" -g "${package_user}" "${package_output}"
          source_date_epoch=$(git show -s --format=%ct "${GITHUB_SHA}")
          runuser -u "${package_user}" -- env \
            SOURCE_DATE_EPOCH="${source_date_epoch}" \
            packaging/release/build-arch-package.sh \
              "${RELEASE_VERSION}" "$PWD/stage" "${package_output}"
          package_path="${package_output}/omacalendar-${{ steps.version.outputs.arch_pkgver }}-1-x86_64.pkg.tar.zst"
          packaging/release/verify-arch-package.sh \
            "${RELEASE_VERSION}" "$PWD/stage" "${package_path}" \
            "${source_date_epoch}"
          cp "${package_path}" artifacts/

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: stage
          format: spdx-json
          output-file: artifacts/omacalendar-${{ steps.version.outputs.value }}.spdx.json
          artifact-name: omacalendar-${{ steps.version.outputs.value }}-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Render AUR recipes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          source_sha=$(sha256sum "artifacts/omacalendar-${RELEASE_VERSION}-source.tar.gz" | cut -d' ' -f1)
          binary_sha=$(sha256sum "artifacts/omacalendar-${RELEASE_VERSION}-linux-x86_64.tar.zst" | cut -d' ' -f1)
          packaging/release/render-aur.sh \
            "${RELEASE_VERSION}" "${source_sha}" "${binary_sha}" aur-rendered
          cp aur-rendered/source/PKGBUILD artifacts/PKGBUILD
          cp aur-rendered/binary/PKGBUILD artifacts/PKGBUILD-bin

      - name: Attest archive provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/omacalendar-${{ steps.version.outputs.value }}-linux-x86_64.tar.zst
            artifacts/omacalendar-${{ steps.version.outputs.value }}-source.tar.gz
            artifacts/omacalendar-${{ steps.version.outputs.arch_pkgver }}-1-x86_64.pkg.tar.zst

      - name: Attest binary SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            artifacts/omacalendar-${{ steps.version.outputs.value }}-linux-x86_64.tar.zst
            artifacts/omacalendar-${{ steps.version.outputs.arch_pkgver }}-1-x86_64.pkg.tar.zst
          sbom-path: artifacts/omacalendar-${{ steps.version.outputs.value }}.spdx.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omacalendar-${{ steps.version.outputs.value }}-arch-candidate
          path: artifacts/
          if-no-files-found: error

  debian:
    name: Build, install, and attest Debian package
    needs: build-release-candidate
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.build-release-candidate.outputs.version }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build native Ubuntu 26.04 package and run automated matrix
        env:
          OMACALENDAR_BUILD_GOOGLE_CLIENT_ID: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_ID }}
          OMACALENDAR_BUILD_GOOGLE_CLIENT_SECRET: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_SECRET }}
        run: |
          mkdir artifacts
          docker build -f packaging/debian/Dockerfile -t omacalendar-debian-builder .
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/artifacts:/output" \
            -e SOURCE_DATE_EPOCH -e OMACALENDAR_BUILD_GOOGLE_CLIENT_ID \
            -e OMACALENDAR_BUILD_GOOGLE_CLIENT_SECRET \
            -e OMACALENDAR_REQUIRE_GOOGLE_OAUTH_CONFIG=ON \
            omacalendar-debian-builder bash packaging/release/build-deb-release.sh \
              "${RELEASE_VERSION}" /output
      - name: Install and remove in a clean Ubuntu runtime
        run: |
          source packaging/release/version-lib.sh
          source packaging/release/deb-version-lib.sh
          package="omacalendar_$(deb_package_version "${RELEASE_VERSION}")_amd64.deb"
          docker run --rm -v "$PWD:/source:ro" -v "$PWD/artifacts:/packages:ro" \
            ubuntu:26.04@sha256:2260313b31c8c011cd2eebe728008efac1b3982be73eb71348ea2648d2c0e09b \
            bash /source/packaging/release/test-deb-package.sh \
              "${RELEASE_VERSION}" "/packages/${package}"
          dpkg-deb --extract "artifacts/${package}" debian-stage
      - name: Generate Debian SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: debian-stage
          format: spdx-json
          output-file: artifacts/omacalendar-${{ env.RELEASE_VERSION }}-debian.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest Debian provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.deb
      - name: Attest Debian SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.deb
          sbom-path: artifacts/omacalendar-${{ env.RELEASE_VERSION }}-debian.spdx.json
      - name: Upload Debian candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omacalendar-${{ env.RELEASE_VERSION }}-debian-candidate
          path: artifacts/
          if-no-files-found: error

  flatpak:
    name: Build, install, and attest Flatpak bundle
    needs: build-release-candidate
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.build-release-candidate.outputs.version }}
      FLATPAK_USER_DIR: /tmp/omacalendar-flatpak-user
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Flatpak build tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder dbus-x11 jq
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.kde.Sdk//6.10 org.kde.Platform//6.10
      - name: Build exact source as a Flatpak bundle
        env:
          OMACALENDAR_BUILD_GOOGLE_CLIENT_ID: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_ID }}
          OMACALENDAR_BUILD_GOOGLE_CLIENT_SECRET: ${{ secrets.OMACALENDAR_GOOGLE_CLIENT_SECRET }}
        run: |
          git archive --format=tar.gz --prefix="omacalendar-${RELEASE_VERSION}/" \
            --output=/tmp/omacalendar-flatpak-source.tar.gz HEAD
          bash packaging/release/build-flatpak.sh \
            /tmp/omacalendar-flatpak-source.tar.gz "${RELEASE_VERSION}" "$PWD/artifacts"
      - name: Install and exercise the actual sandbox
        run: |
          dbus-run-session -- bash packaging/release/verify-flatpak.sh \
            "$PWD/artifacts/omacalendar-${RELEASE_VERSION}-linux-x86_64.flatpak" \
            "${RELEASE_VERSION}"
      - name: Generate Flatpak SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: artifacts/flatpak-stage
          format: spdx-json
          output-file: artifacts/omacalendar-${{ env.RELEASE_VERSION }}-flatpak.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest Flatpak provenance
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.flatpak
      - name: Attest Flatpak SBOM
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*.flatpak
          sbom-path: artifacts/omacalendar-${{ env.RELEASE_VERSION }}-flatpak.spdx.json
      - name: Upload Flatpak candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omacalendar-${{ env.RELEASE_VERSION }}-flatpak-candidate
          path: |
            artifacts/*.flatpak
            artifacts/*flatpak*.txt
            artifacts/*flatpak.spdx.json
          if-no-files-found: error

  assemble:
    name: Assemble complete candidate draft
    needs: [build-release-candidate, debian, flatpak]
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ needs.build-release-candidate.outputs.version }}
    steps:
      - name: Check out candidate documentation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Gather independently validated packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: omacalendar-${{ env.RELEASE_VERSION }}-*-candidate
          path: artifacts
          merge-multiple: true
      - name: Include exact documentation and write complete checksums
        run: |
          git archive --format=tar.gz --prefix="omacalendar-${RELEASE_VERSION}-documentation/" \
            --output="artifacts/omacalendar-${RELEASE_VERSION}-documentation.tar.gz" \
            HEAD README.md CHANGELOG.md LICENSE SECURITY.md SUPPORT.md docs
          cp docs/INSTALL.md artifacts/INSTALL.md
          cp docs/OWNER_TESTING.md artifacts/OWNER_TESTING.md
          cp "docs/releases/${RELEASE_VERSION}.md" artifacts/CANDIDATE-ACCEPTANCE.md
          cd artifacts
          mapfile -t assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS \
            -printf '%f\n' | LC_ALL=C sort)
          sha256sum "${assets[@]}" >SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest source documentation
        if: github.event_name == 'push'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/*documentation.tar.gz
      - name: Upload complete candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: omacalendar-${{ env.RELEASE_VERSION }}-release-candidate
          path: artifacts/
          if-no-files-found: error
      - name: Create complete draft GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing_state=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [[ ${existing_state} == true ]]; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          elif [[ ${existing_state} == false ]]; then
            echo "refusing to replace assets on an already published release" >&2
            exit 1
          else
            release_flags=(--draft --verify-tag)
            if [[ ${RELEASE_VERSION} == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              "${release_flags[@]}" --notes-file "docs/releases/${RELEASE_VERSION}.md" \
              --title "OmaCalendar ${RELEASE_VERSION} - owner testing candidate"
          fi
      - name: Summarize candidate disposition
        run: |
          {
            echo '### All package formats and documentation assembled'
            echo
            echo 'Arch, Debian and Flatpak were built from the same commit.'
            echo 'Owner and live-provider acceptance remain separate pending gates.'
            echo 'The workflow never publishes a release; signed tag runs create drafts only.'
          } >>"${GITHUB_STEP_SUMMARY}"
